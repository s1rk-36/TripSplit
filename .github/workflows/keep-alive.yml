name: Keep backend awake

# Render spins a free web service down after 15 idle minutes, and Aiven powers off a
# database that sees no connections. /api/health runs "select 1", so a single ping
# keeps both ends alive. The hour budget behind this schedule is in DEPLOY.md § 7.

on:
  schedule:
    # Every 10 minutes, skipping 07:00-09:00 UTC. That nightly quiet window keeps the
    # month near 690 of Render's 750 free instance hours, leaving headroom for visitors
    # who wake the service themselves and for deploy overlap.
    #
    # GitHub cron is always UTC, so the window sits at 3-5 AM Eastern in summer and
    # 2-4 AM in winter. Either is fine; it only needs to miss normal waking hours.
    #
    # Offset to :03 rather than :00 on purpose. GitHub delays scheduled runs under
    # load and the top of the hour is the most contended slot.
    - cron: '3-59/10 0-6,9-23 * * *'
  workflow_dispatch:

# Never let a slow cold start stack up behind the next scheduled run.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          # Deliberately no default. Render subdomains are globally unique and the
          # obvious name is already registered to an unrelated app, so a guessed URL
          # would keep a stranger's service awake while this one slept.
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -uo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::error::HEALTH_URL is not set. Copy the backend URL from the Render \
          dashboard and add it under Settings -> Secrets and variables -> Actions -> \
          Variables as HEALTH_URL, ending in /api/health."
            exit 1
          fi

          # Waking a sleeping instance takes about a minute, so allow a long timeout
          # and retry before calling it a failure. Only a genuine outage should go red.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health-body -w '%{http_code}' \
              --max-time 90 "$HEALTH_URL" || echo 000)

            if [ "$code" = "200" ]; then
              echo "Healthy (HTTP $code): $(cat /tmp/health-body)"

              # The endpoint answers 200 whenever the app is up and reports database
              # state in the body, so surface a database outage as a warning here.
              if grep -q '"database":"down"' /tmp/health-body; then
                echo "::warning::API is up but the database is unreachable. \
          Check whether the Aiven service powered off."
              fi
              exit 0
            fi

            echo "Attempt $attempt failed (HTTP $code)"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::Health check failed after 3 attempts against $HEALTH_URL"
          exit 1
