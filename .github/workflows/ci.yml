name: CI

# Builds both halves of the app on every push and pull request. The backend has no
# local build on the author's machine (no Maven, no Docker), so this workflow is the
# only thing that compiles the server before Render does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Java 11 · Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The repository's test suite talks to a real MySQL, so give it one and load
    # the schema the tests expect. Matches trip-split-schema-test.sql, which
    # creates the trip_split_test database itself.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Load test schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_password \
            < server/sql/trip-split-schema-test.sql

      - name: Build and test
        working-directory: server
        env:
          # MySQL 8 defaults to caching_sha2_password. Over a plaintext connection the
          # 8.x connector refuses to fetch the server's public key unless asked, which
          # fails every DB-backed test with "Public Key Retrieval is not allowed".
          TRIP_SPLIT_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/trip_split_test?allowPublicKeyRetrieval=true&useSSL=false
          TRIP_SPLIT_DB_USERNAME: root
          TRIP_SPLIT_DB_PASSWORD: ci_root_password
          # The S3/R2 client is constructed at startup, so it needs values present.
          # These are throwaway placeholders; nothing in CI uploads anything.
          YOUR_ACCESS_KEY: ci-not-a-real-key
          YOUR_SECRET_KEY: ci-not-a-real-secret
        run: mvn -B --no-transfer-progress verify

      # Downloading raw job logs needs admin rights on the repo, so print the actual
      # assertion output here where anyone can read it.
      - name: Show failing tests
        if: failure()
        working-directory: server
        run: |
          shopt -s nullglob
          found=0
          for f in target/surefire-reports/*.txt; do
            if grep -qE "Failures: [1-9]|Errors: [1-9]" "$f"; then
              found=1
              echo "::group::$(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          [ "$found" = "1" ] || echo "No surefire failures recorded — the build failed before or after the tests."
          # Never let this reporting step mask the real failure above.
          exit 0

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  client:
    name: Client (React · CRA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/trip-split-client/package-lock.json

      - name: Install
        working-directory: client/trip-split-client
        run: npm ci

      - name: Build
        working-directory: client/trip-split-client
        # Same flag Render builds with: CRA treats lint warnings as errors when CI=true.
        env:
          CI: false
        run: npm run build

  # Deploy only after both halves pass, and only from main. Render's own
  # auto-deploy fires on every push regardless of whether the tests went green,
  # which is what this replaces — turn "Auto-Deploy" off on both services and let
  # this job be the only thing that ships.
  #
  # Set RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_WEB as repository secrets,
  # each the service's "Deploy Hook" URL from Render → Settings. Treat them as
  # passwords: anyone holding one can trigger a deploy.
  deploy:
    name: Deploy (Render)
    needs: [server, client]
    # Pushes to main deploy automatically; "Run workflow" on main deploys on demand,
    # which is the natural way to redeploy after changing a setting in Render rather
    # than inventing an empty commit. Pull requests never reach here.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never let two deploys race; wait rather than cancel, so the newest commit
    # is not dropped mid-rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy backend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_API is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 "$HOOK" > /dev/null
          echo "Backend deploy triggered."

      # The API URL is compiled into the bundle, so the frontend must be rebuilt
      # whenever it changes — editing the env var alone does nothing.
      - name: Deploy frontend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_WEB is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 "$HOOK" > /dev/null
          echo "Frontend deploy triggered."

      # The hooks return as soon as Render queues the build, so a green job means
      # "deploy started", not "deploy finished". Wait for the API to answer with
      # the new build before calling it done.
      - name: Wait for the API to come back healthy
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS --max-time 20 https://tripsplit-api-o4s1.onrender.com/api/health || true)
            case "$body" in
              *'"status":"up"'*)
                echo "API healthy: $body"
                exit 0
                ;;
            esac
            echo "waiting for the API to report healthy… ($i/40)"
            sleep 15
          done
          echo "::error::API did not report healthy within 10 minutes — check the Render logs."
          exit 1
