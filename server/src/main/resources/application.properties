server.port=${PORT:8080}

spring.datasource.url=${TRIP_SPLIT_DB_URL:jdbc:mysql://localhost:3306/trip_split}
spring.datasource.username=${TRIP_SPLIT_DB_USERNAME}
spring.datasource.password=${TRIP_SPLIT_DB_PASSWORD}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# HS256 signing key, at least 32 characters. Empty = random key per run (dev only).
jwt.secret=${JWT_SECRET:}

# S3-compatible object storage (defaults target AWS; override for Cloudflare R2).
# For R2: S3_ENDPOINT_URL=https://<accountid>.r2.cloudflarestorage.com, S3_REGION=auto,
# S3_PUBLIC_URL=https://<your-r2-public-domain> (r2.dev URL or custom domain).
amazonProperties.region=${S3_REGION:us-east-1}
amazonProperties.endpointUrl=${S3_ENDPOINT_URL:https://s3.amazonaws.com}
# Public base URL objects are served from. Empty = fall back to the S3 API URL (AWS only).
amazonProperties.publicUrl=${S3_PUBLIC_URL:}
# Leave keys unset to run without storage; receipt-image upload is the only feature that needs it.
amazonProperties.accessKey=${YOUR_ACCESS_KEY:}
amazonProperties.secretKey=${YOUR_SECRET_KEY:}
amazonProperties.bucketName=${S3_BUCKET_NAME:trip-split}
amazonProperties.acl=PublicRead

logging.level.com.amazonaws.request=DEBUG
logging.level.com.amazonaws.auth=DEBUG
logging.level.learn.tripsplit=DEBUG
